name: Publish approved updates

# The publisher pushes James-approved updates to the `staging` branch.
# This workflow takes them live by fast-forwarding `main` to `staging`, then stamps the signal strip date.
on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to staging
        run: |
          git fetch origin staging
          git merge --ff-only origin/staging
          git push origin main

      - name: Stamp signal strip date
        run: |
          python3 - <<'PYEOF'
          import re
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).strftime('%B %-d, %Y')
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(r'Updated [A-Za-z]+ \d{1,2}, \d{4}', f'Updated {today}', content)
          if new_content != content:
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(new_content)
          PYEOF
          git config user.name "signal-fire-aim-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Auto-stamp correct push date [bot]"
            git push origin main
          fi
